components:
  schemas:
    DocVersion:
      properties:
        id:
          type: integer
        tag:
          type: string
          example: 4.2.0
        label:
          type: string
          example: v4.2
        sortKey:
          type: integer
        releasedAt:
          type: string
          example: '2025-09-09'
          nullable: true
        isLatest:
          type: boolean
        isSupported:
          type: boolean
      type: object
    DocContextOption:
      properties:
        key:
          type: string
          example: ts
        label:
          type: string
          example: TypeScript
        isDefault:
          type: boolean
      type: object
    DocParam:
      description: 'One parameter or field of a contract'
      properties:
        name:
          type: string
        type:
          type: string
        required:
          type: boolean
        default:
          type: string
          nullable: true
        description:
          type: string
        since:
          type: string
          nullable: true
      type: object
    DocContract:
      description: "A symbol's contract over a version range"
      properties:
        id:
          type: integer
        symbolId:
          type: integer
        introducedVersionId:
          type: integer
        removedVersionId:
          type: integer
          nullable: true
        introducedLabel:
          type: string
        removedLabel:
          type: string
          nullable: true
        signature:
          type: string
        summary:
          type: string
        status:
          type: string
          example: stable
        params:
          type: array
          items:
            $ref: '#/components/schemas/DocParam'
        returns:
          type: object
        throws:
          type: array
          items:
            type: object
        sourcePath:
          type: string
          nullable: true
        sourceLine:
          type: integer
          nullable: true
        sourceUrl:
          type: string
          nullable: true
      type: object
    DocSymbolNode:
      description: 'A symbol resolved at a version, with the contract valid there'
      properties:
        ref:
          type: string
          example: 'tessel/query#QueryOptions.staleTime'
        name:
          type: string
          example: QueryOptions.staleTime
        shortName:
          type: string
          example: staleTime
        kind:
          type: string
          example: option
        state:
          type: string
          enum:
            - current
            - removed
        sinceLabel:
          type: string
        changedLabel:
          type: string
          nullable: true
        removedLabel:
          type: string
          nullable: true
        route:
          type: string
          example: /v4.2/reference/tessel/query/QueryOptions.staleTime
        contract:
          $ref: '#/components/schemas/DocContract'
        children:
          type: array
          items:
            type: object
      type: object
    DocPageSummary:
      properties:
        id:
          type: integer
        mode:
          type: string
          enum:
            - learn
            - do
            - reference
            - explain
        slug:
          type: string
        title:
          type: string
        summary:
          type: string
        minutes:
          type: integer
          nullable: true
        route:
          type: string
      type: object
    DocPage:
      allOf:
        -
          $ref: '#/components/schemas/DocPageSummary'
        -
          properties:
            body:
              description: 'Markdown with directives, unrendered'
              type: string
            introducedLabel:
              type: string
            removedLabel:
              type: string
              nullable: true
            updated:
              type: string
          type: object
    DocCodeSample:
      properties:
        key:
          type: string
        title:
          description: 'Display title, usually a file name'
          type: string
          nullable: true
        language:
          type: string
        variant:
          type: string
          nullable: true
        code:
          type: string
        isTested:
          type: boolean
        lastTestPassLabel:
          type: string
          nullable: true
      type: object
    DocChangeSummary:
      properties:
        id:
          type: integer
        kind:
          type: string
          enum:
            - breaking
            - behavior
            - deprecated
            - added
            - removed
        title:
          type: string
        versionLabel:
          type: string
        hasCodemod:
          type: boolean
        codemodCmd:
          type: string
          nullable: true
      type: object
    DocContractDiff:
      properties:
        ref:
          type: string
        name:
          type: string
        before:
          oneOf:
            -
              $ref: '#/components/schemas/DocContract'
          nullable: true
        after:
          oneOf:
            -
              $ref: '#/components/schemas/DocContract'
          nullable: true
        signatureChanged:
          type: boolean
        paramsAdded:
          type: array
          items:
            $ref: '#/components/schemas/DocParam'
        paramsChanged:
          type: array
          items:
            type: object
        paramsRemoved:
          type: array
          items:
            $ref: '#/components/schemas/DocParam'
      type: object
    DocError:
      description: 'Error responses carry a plain message string'
      type: string
      example: "Unknown version 'v9.9'"
    DocAdminResource:
      description: 'Documentation tables exposed for authoring'
      type: string
      enum:
        - Versions
        - Modules
        - Symbols
        - Contracts
        - Pages
        - Samples
        - Changes
        - Courses
        - Lessons
        - Steps
        - ContextOptions
    DocAdminRecord:
      description: 'One row of a documentation table with camelCase field names; `id` is assigned by the server. Contracts carry decoded params/returns/throws; symbols carry their `ref`.'
      properties:
        id:
          type: integer
      type: object
      additionalProperties: true
    DocAdminSymbolLink:
      properties:
        symbolId:
          type: integer
        ref:
          type: string
          example: 'tessel/query#QueryOptions.staleTime'
        name:
          type: string
        kind:
          type: string
        role:
          description: 'Pages only'
          type: string
          enum:
            - subject
            - mentions
      type: object
    StatusResponseData:
      description: 'Basic response data structure for including a status code and message'
      properties:
        status:
          description: 'Status code for response'
          type: number
        message:
          description: 'Message for response'
          type: string
      type: object
  securitySchemes:
    header_token:
      type: http
      scheme: bearer
    cookie_token:
      type: apiKey
      name: zsf_token
      in: cookie
    admin_header_token:
      type: http
      scheme: bearer
    admin_cookie_token:
      type: apiKey
      name: zsf_token
      in: cookie
