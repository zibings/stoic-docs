openapi: 3.0.0
info:
  title: 'ZSF API'
  version: '1.1'
servers:
  -
    url: /api/1.1
    description: 'ZSF API'
paths:
  /Account/CheckEmail:
    post:
      tags:
        - Account
      summary: 'Check if an email is valid and not in-use'
      description: 'Check if an email is valid and not in-use'
      operationId: checkEmail
      requestBody:
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponseData'
  /Account/CheckSession:
    get:
      tags:
        - Account
      summary: 'Check if the current session is valid'
      description: 'Check if the current session is valid'
      operationId: checkSession
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
  /Account/CheckToken:
    post:
      tags:
        - Account
      summary: 'Check if a token is valid for a user'
      description: 'Check if a token is valid for a user'
      operationId: checkToken
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
        '500':
          description: Invalid
          content:
            application/json:
              schema:
                type: string
  /Account/Confirm:
    post:
      tags:
        - Account
      summary: "Confirms a user's email address"
      description: "Confirms a user's email address"
      operationId: confirmUser
      requestBody:
        content:
          application/json:
            schema:
              properties:
                token:
                  type: string
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
  /Account/Create:
    post:
      tags:
        - Account
      summary: 'Creates a new user in the system'
      description: 'Creates a new user in the system'
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                key:
                  type: string
                confirmKey:
                  type: string
                provider:
                  type: number
                emailConfirmed:
                  type: boolean
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  email: { type: string }
                  key: { type: string }
                  confirmKey: { type: string }
                  provider: { type: number }
                  emailConfirmed: { type: boolean }
                type: object
        '500':
          description: Failed
          content:
            application/json:
              schema:
                type: string
      security:
        -
          admin_header_token: []
        -
          admin_cookie_token: []
  /Account/Delete:
    post:
      tags:
        - Account
      summary: 'Removes user from system'
      description: 'Removes user from system'
      operationId: deleteUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                userId:
                  type: number
              type: object
      responses:
        '200':
          description: OK
        '500':
          description: Failed
          content:
            application/json:
              schema:
                type: string
      security:
        -
          header_token: []
        -
          cookie_token: []
  /Account:
    get:
      tags:
        - Account
      summary: "Attempts to retrieve a user's account information, only works for current user and administrators."
      operationId: getAccount
      parameters:
        -
          name: userId
          in: query
          description: 'unique user identifier'
          required: false
          schema:
            type: number
      responses:
        '200':
          description: 'Account data'
          content:
            application/json:
              schema:
                properties:
                  email: { description: "User's email address", type: string }
                  emailConfirmed: { description: "If user's email address has been confirmed", type: boolean }
                  id: { description: "User's unique identifier", type: number }
                  joined: { description: 'Date and time the user joined', type: string }
                  lastActive: { description: 'Date and time the user was last active, if available', type: string }
                  lastLogin: { description: 'Date and time the user last logged in, if available', type: string }
                type: object
      security:
        -
          header_token: []
        -
          cookie_token: []
  /Account/Login:
    post:
      tags:
        - Account
      summary: 'Logs user into system'
      description: 'Logs user into system'
      operationId: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                key:
                  type: string
                provider:
                  type: number
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  userId: { type: number }
                  token: { type: string }
                  bearer: { type: string }
                type: object
  /Account/Logout:
    post:
      tags:
        - Account
      summary: 'Logs current user out of system'
      description: 'Logs current user out of system'
      operationId: Logout
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                userId:
                  type: number
                token:
                  type: string
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  userId: { type: number }
                  token: { type: string }
                type: object
      security:
        -
          header_token: []
        -
          cookie_token: []
  /Account/Register:
    post:
      tags:
        - Account
      summary: 'Registers user with system'
      description: 'Registers user with system'
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
                key:
                  type: string
                confirmKey:
                  type: string
                provider:
                  type: number
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  email: { type: string }
                  password: { type: string }
                  confirmPassword: { type: string }
                  provider: { type: number }
                  emailConfirmed: { type: boolean }
                type: object
  /Account/ResetPassword:
    post:
      tags:
        - Account
      summary: "Resets a user's password"
      description: "Resets a user's password"
      operationId: resetPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                key:
                  type: string
                token:
                  type: string
              type: object
      responses:
        '200':
          description: OK
  /Account/SendPasswordReset:
    post:
      tags:
        - Account
      summary: 'Sends user a password reset token'
      description: 'Sends user a password reset token'
      operationId: sendPasswordReset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                email:
                  type: string
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: boolean
  /Account/Update:
    post:
      tags:
        - Account
      summary: "Updates a user's account details"
      description: "Updates a user's account details"
      operationId: updateAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                userId:
                  type: number
                email:
                  type: string
                password:
                  type: string
                oldPassword:
                  type: string
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  email: { type: string }
                  password: { type: string }
                  confirmPassword: { type: string }
                  provider: { type: number }
                  emailConfirmed: { type: boolean }
                type: object
      security:
        -
          header_token: []
        -
          cookie_token: []
  /Docs/Site:
    get:
      tags:
        - Docs
      summary: 'Site bootstrap'
      description: "Everything the shell needs on first load: versions, the latest label, context-bar options, and the library's name and repository"
      operationId: docsSite
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  libraryName: { type: string }
                  repoUrl: { type: string }
                  siteUrl: { description: 'Public origin of the docs site, used for the sitemap; null until configured', type: string, nullable: true }
                  latest: { type: string, example: v4.2, nullable: true }
                  versions: { type: array, items: { $ref: '#/components/schemas/DocVersion' } }
                  contextOptions: { properties: { languages: { type: array, items: { $ref: '#/components/schemas/DocContextOption' } }, packageManagers: { type: array, items: { $ref: '#/components/schemas/DocContextOption' } } }, type: object }
                  modes: { type: array, items: { type: string } }
                type: object
  /Docs/Versions:
    get:
      tags:
        - Docs
      summary: 'List versions'
      description: 'Every documented version, oldest first'
      operationId: docsVersions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocVersion'
  '/Docs/Tree/{version}':
    get:
      tags:
        - Docs
      summary: 'Browse tree at a version'
      description: 'Modules with their symbols resolved at the version; removed symbols are included unless removed=0'
      operationId: docsTree
      parameters:
        -
          name: version
          in: path
          description: 'Version label, tag, or `latest`'
          required: true
          schema:
            type: string
            example: v4.2
        -
          name: removed
          in: query
          description: 'Set to 0 to omit removed symbols'
          required: false
          schema:
            type: integer
            enum:
              - 0
              - 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  version: { $ref: '#/components/schemas/DocVersion' }
                  modules: { type: array, items: { properties: { path: { type: string }, summary: { type: string }, count: { type: integer }, symbols: { type: array, items: { $ref: '#/components/schemas/DocSymbolNode' } } }, type: object } }
                type: object
        '404':
          description: 'Unknown version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
  '/Docs/Symbol/{version}/{module}/{name}':
    get:
      tags:
        - Docs
      summary: 'Symbol at a version'
      description: "The symbol's contract at the version, its reference page, code samples, other pages covering it, changes touching it, and its siblings for the rail"
      operationId: docsSymbol
      parameters:
        -
          name: version
          in: path
          description: 'Version label, tag, or `latest`'
          required: true
          schema:
            type: string
            example: v4.2
        -
          name: module
          in: path
          description: 'Module path; may contain slashes'
          required: true
          schema:
            type: string
            example: tessel/query
        -
          name: name
          in: path
          description: 'Symbol name; dotted for nested symbols'
          required: true
          schema:
            type: string
            example: QueryOptions.staleTime
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  version: { $ref: '#/components/schemas/DocVersion' }
                  module: { properties: { path: { type: string }, summary: { type: string } }, type: object }
                  breadcrumb: { type: array, items: { type: string } }
                  symbol: { $ref: '#/components/schemas/DocSymbolNode' }
                  relatedTypes: { description: 'Sibling type symbols named by parameter types, keyed by type name', type: object, additionalProperties: { $ref: '#/components/schemas/DocSymbolNode' } }
                  mentions: { description: 'Symbols the reference page mentions, resolved at the version', type: array, items: { $ref: '#/components/schemas/DocSymbolNode' } }
                  page: { oneOf: [{ $ref: '#/components/schemas/DocPage' }], nullable: true }
                  samples: { type: array, items: { $ref: '#/components/schemas/DocCodeSample' } }
                  testedSamples: { properties: { total: { type: integer }, passingAtVersion: { type: integer } }, type: object }
                  alsoCoveredIn: { type: array, items: { $ref: '#/components/schemas/DocPageSummary' } }
                  changes: { type: array, items: { $ref: '#/components/schemas/DocChangeSummary' } }
                  siblings: { type: array, items: { $ref: '#/components/schemas/DocSymbolNode' } }
                type: object
        '404':
          description: 'Unknown version or symbol not present at that version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
  '/Docs/Page/{version}/{mode}/{slug}':
    get:
      tags:
        - Docs
      summary: 'Page at a version'
      description: 'The page revision valid at the version, its linked symbols with their contracts, code samples, and for learn mode the course spine and steps'
      operationId: docsPage
      parameters:
        -
          name: version
          in: path
          description: 'Version label, tag, or `latest`'
          required: true
          schema:
            type: string
            example: v4.2
        -
          name: mode
          in: path
          required: true
          schema:
            type: string
            enum:
              - learn
              - do
              - reference
              - explain
        -
          name: slug
          in: path
          description: 'Page slug; may contain slashes'
          required: true
          schema:
            type: string
            example: prefetch-on-hover
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  version: { $ref: '#/components/schemas/DocVersion' }
                  page: { $ref: '#/components/schemas/DocPage' }
                  symbols: { type: array, items: { $ref: '#/components/schemas/DocSymbolNode' } }
                  samples: { type: array, items: { $ref: '#/components/schemas/DocCodeSample' } }
                  course: { description: 'Present for learn-mode pages that belong to a course', properties: { slug: { type: string }, title: { type: string }, totalMinutes: { type: integer }, lessonCount: { type: integer }, currentLesson: { type: integer }, lessons: { type: array, items: { type: object } }, steps: { type: array, items: { type: object } } }, type: object, nullable: true }
                type: object
        '404':
          description: 'Unknown version or no page valid at that version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
  '/Docs/Diff/{from}/{to}':
    get:
      tags:
        - Docs
      summary: 'Changes between two versions'
      description: 'Changes shipped after `from` up to and including `to`, grouped by kind, with affected symbols and computed contract diffs'
      operationId: docsDiff
      parameters:
        -
          name: from
          in: path
          description: 'Older version label, tag, or `latest`'
          required: true
          schema:
            type: string
            example: v3.8
        -
          name: to
          in: path
          description: 'Newer version label, tag, or `latest`'
          required: true
          schema:
            type: string
            example: v4.2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  from: { $ref: '#/components/schemas/DocVersion' }
                  to: { $ref: '#/components/schemas/DocVersion' }
                  versions: { type: array, items: { $ref: '#/components/schemas/DocVersion' } }
                  total: { type: integer }
                  groups: { type: array, items: { properties: { kind: { type: string }, count: { type: integer }, changes: { type: array, items: { allOf: [{ $ref: '#/components/schemas/DocChangeSummary' }, { properties: { why: { type: string }, rfcUrl: { type: string, nullable: true }, beforeCode: { type: string, nullable: true }, afterCode: { type: string, nullable: true }, symbols: { type: array, items: { type: object } }, contractDiffs: { type: array, items: { $ref: '#/components/schemas/DocContractDiff' } } }, type: object }] } } }, type: object } }
                  route: { type: string, example: /upgrade/v3.8/v4.2 }
                type: object
        '400':
          description: '`from` is not older than `to`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
        '404':
          description: 'Unknown version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
  '/Docs/Manifest/{version}':
    get:
      tags:
        - Docs
      summary: 'Build manifest for a version'
      description: 'Every public route that exists at the version, and the records the per-version search index is generated from'
      operationId: docsManifest
      parameters:
        -
          name: version
          in: path
          description: 'Version label, tag, or `latest`'
          required: true
          schema:
            type: string
            example: v4.2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  version: { $ref: '#/components/schemas/DocVersion' }
                  previous: { oneOf: [{ $ref: '#/components/schemas/DocVersion' }], nullable: true }
                  routes: { type: array, items: { type: string } }
                  searchRecords: { type: array, items: { properties: { type: { type: string, enum: [symbol, page, change] } }, type: object } }
                type: object
        '404':
          description: 'Unknown version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
  '/Docs/Admin/{resource}':
    get:
      tags:
        - DocsAdmin
      summary: 'List rows of a documentation table'
      description: 'Every row, including ones removed or not yet introduced at any version. Filterable by parent (moduleId, symbolId, pageId, versionId, courseId, lessonId), mode, or kind where applicable.'
      operationId: docsAdminList
      parameters:
        -
          name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DocAdminResource'
        -
          name: moduleId
          in: query
          required: false
          schema:
            type: integer
        -
          name: symbolId
          in: query
          required: false
          schema:
            type: integer
        -
          name: pageId
          in: query
          required: false
          schema:
            type: integer
        -
          name: versionId
          in: query
          required: false
          schema:
            type: integer
        -
          name: courseId
          in: query
          required: false
          schema:
            type: integer
        -
          name: lessonId
          in: query
          required: false
          schema:
            type: integer
        -
          name: mode
          in: query
          required: false
          schema:
            type: string
        -
          name: kind
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocAdminRecord'
        '404':
          description: 'Unknown resource'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
      security:
        -
          admin_header_token: []
        -
          admin_cookie_token: []
    post:
      tags:
        - DocsAdmin
      summary: 'Create a row'
      description: "Body carries the row's fields in camelCase. Validation failures (duplicates, overlapping contract ranges, unknown versions) return 400 with a message."
      operationId: docsAdminCreate
      parameters:
        -
          name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DocAdminResource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocAdminRecord'
      responses:
        '200':
          description: 'Created row'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAdminRecord'
        '400':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
      security:
        -
          admin_header_token: []
        -
          admin_cookie_token: []
  '/Docs/Admin/{resource}/{id}':
    get:
      tags:
        - DocsAdmin
      summary: 'Get a row'
      description: 'Retrieves one row.'
      operationId: docsAdminGet
      parameters:
        -
          name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DocAdminResource'
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAdminRecord'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
      security:
        -
          admin_header_token: []
        -
          admin_cookie_token: []
    put:
      tags:
        - DocsAdmin
      summary: 'Update a row'
      description: 'Only fields present in the body change.'
      operationId: docsAdminUpdate
      parameters:
        -
          name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DocAdminResource'
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DocAdminRecord'
      responses:
        '200':
          description: 'Updated row'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAdminRecord'
        '400':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
      security:
        -
          admin_header_token: []
        -
          admin_cookie_token: []
    delete:
      tags:
        - DocsAdmin
      summary: 'Delete a row'
      description: "Children cascade (a module's symbols, a page's samples). Rows still referenced elsewhere, such as a version with contracts, are rejected."
      operationId: docsAdminDelete
      parameters:
        -
          name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DocAdminResource'
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                properties:
                  deleted: { type: integer }
                type: object
        '400':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
      security:
        -
          admin_header_token: []
        -
          admin_cookie_token: []
  '/Docs/Admin/{resource}/Reorder':
    post:
      tags:
        - DocsAdmin
      summary: 'Reorder rows'
      description: 'Sets sortOrder (modules, symbols, changes, courses, context options) or ordinal (lessons, steps) to the position of each id in the list, 1-based.'
      operationId: docsAdminReorder
      parameters:
        -
          name: resource
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/DocAdminResource'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - ids
              properties:
                ids:
                  type: array
                  items: { type: integer }
              type: object
      responses:
        '200':
          description: 'Rows in their new order'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DocAdminRecord'
        '400':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
      security:
        -
          admin_header_token: []
        -
          admin_cookie_token: []
  '/Docs/Admin/Versions/{id}/Latest':
    post:
      tags:
        - DocsAdmin
      summary: 'Mark a version as latest'
      description: 'Marks a version as the one `latest` resolves to.'
      operationId: docsAdminMarkLatest
      parameters:
        -
          name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 'The version'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocAdminRecord'
        '404':
          description: 'Not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocError'
      security:
        -
